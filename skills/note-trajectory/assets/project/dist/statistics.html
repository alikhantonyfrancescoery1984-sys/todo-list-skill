  }
  function render() {

  function notify(message) {

  function showNote(noteId) {

    if (n) {

    dialog.setAttribute("aria-label", task ? "\u7F16\u8F91\u5F85\u529E" : "\u65B0\u5EFA\u5F85\u529E");
    dialog.innerHTML = `<h2>${task ? "\u7F16\u8F91\u5F85\u529E" : "\u65B0\u5EFA\u5F85\u529E"}</h2>${taskEditor(task)}`;

  }

    const dialog = document.createElement("dialog");

    dialog.setAttribute("aria-label", "\u7BA1\u7406\u6A21\u5757");

    }, (id2) => {

    dialog.addEventListener("close", () => {

  }
  app.addEventListener("toggle", (event) => {

  }, { capture: true });
  app.addEventListener("click", (e) => {

    if (a === "visit") {

      return;
    }
    if (a === "bulk-demo") {

      if (!sources.some((n) => n.path === path)) sources.push({ path, text: "# \u5408\u6210\u591A\u5F85\u529E\u6D4B\u8BD5\n" + Array.from({ length: 7 }, (_, i) => `- [ ] \u6D4B\u8BD5\u5F85\u529E ${i + 1} ^bulk-${i}`).join("\n") });

      link2.href = url;
      link2.download = "note-trajectory-demo.json";

      return;
    }
  });
  app.addEventListener("change", (e) => {
    const input = e.target;
    if (input.dataset.complete) {

      return;
